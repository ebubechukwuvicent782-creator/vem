<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        .one{
            height: 250px;
            width: 250px;
            background-color: darkblue;
            border-radius: 20px;
            margin-left: 90px;
            margin-top: 50px;
        }
        .two{
            height: 200px;
            width: 200px;
            background-color: darkgreen;
            margin-top: 50px;
            margin-left: 90px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="one"></div>
    <div class="two"></div>
</body>
</html>
