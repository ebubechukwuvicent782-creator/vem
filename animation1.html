<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0%;
            margin: 0%;
        }
        @keyframes snrman {
            0%{
                top: 0%;
                left: 0%;
            }
            15%{
                top: 70px;
                left: 10%;
            }
            30%{
                top: 0%;
                left: 20%;
            }
            45%{
                top: 70px;
                left: 30%;
            }
            60%{
                top: 0%;
                left: 55%;
            }
            75%{
                top: 70px;
                left: 70%;
            }
            90%{
                top: 70px;
                left: 85%;
            }
            100%{
                top: 70px;
                left: 100%;
            }
        }
        div{
            height: 150px;
            width: 150px;
            border-radius: 25%;
            background-color: brown;
            position: absolute;
            animation-name: snrman;
            animation-duration: 2s;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
