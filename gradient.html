<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 200px;
            width: 200px;
            border: 2px solid gold;
            margin-bottom: 10px;
        }
        #a{
            background-image: linear-gradient(blue,yellow);
        }
        #b{
            background-image: linear-gradient(white,red,black);
        }
        #c{
            background-image: linear-gradient(to right,yellow,blue,green);
        }
        #d{
            background-image: linear-gradient(to bottom right, red,yellow,green);
        }
        #{
            background-image:radial-gradient(blue,red,black) ;
        }
    </style>
</head>
<body>
    <div id="a"></div>
    <div id="b"></div>
    <div id="c"></div>
    <div id="d"></div>
    <div id="e"></div>
</body>
</html>
